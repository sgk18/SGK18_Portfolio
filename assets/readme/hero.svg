<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 305" width="100%" height="auto" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Courier New', monospace;">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#E5E7EB" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Outer Frame Shadow & Background -->
  <g transform="translate(10, 10)">
    <!-- Drop Shadow Background rect -->
    <rect x="8" y="8" width="864" height="276" fill="#0A0A0A" />
    
    <!-- Main Card Body -->
    <rect x="0" y="0" width="864" height="276" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3" />
    
    <!-- Subtle Grid Background -->
    <rect x="3" y="3" width="858" height="270" fill="url(#grid)" opacity="0.65" />

    <!-- Top HUD Title Bar -->
    <rect x="0" y="0" width="864" height="38" fill="#FFF5F5" stroke="#0A0A0A" stroke-width="3" />
    
    <!-- Status Indicator Dots -->
    <circle cx="22" cy="19" r="6" fill="#E3000F" stroke="#0A0A0A" stroke-width="2" />
    <circle cx="38" cy="19" r="6" fill="#F59E0B" stroke="#0A0A0A" stroke-width="2" />
    <circle cx="54" cy="19" r="6" fill="#10B981" stroke="#0A0A0A" stroke-width="2" />
    
    <text x="75" y="23" font-size="11" font-weight="900" fill="#0A0A0A" letter-spacing="1.5">ATLAS // SYSTEM STATUS: ONLINE</text>
    
    <!-- HUD Badges (Right side) -->
    <g transform="translate(560, 8)">
      <rect x="0" y="0" width="145" height="22" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1.5" />
      <text x="72" y="15" font-size="9.5" font-weight="800" fill="#0A0A0A" text-anchor="middle" letter-spacing="0.8">NEXT.JS 16 · REACT 19</text>
      
      <rect x="155" y="0" width="135" height="22" fill="#E3000F" stroke="#0A0A0A" stroke-width="1.5" />
      <text x="222" y="15" font-size="9.5" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">TURSO · PRISMA ORM</text>
    </g>

    <!-- Main Hero Title Section -->
    <g transform="translate(32, 66)">
      <!-- Red accent block -->
      <rect x="0" y="4" width="14" height="36" fill="#E3000F" stroke="#0A0A0A" stroke-width="2.5" />
      <text x="24" y="35" font-size="34" font-weight="950" fill="#0A0A0A" letter-spacing="-1">ATLAS // CAREER OS</text>
      
      <!-- Updated Domain Link Pill -->
      <g transform="translate(390, 10)">
        <a href="https://suryachalam.vercel.app" target="_blank">
          <rect x="0" y="0" width="245" height="25" fill="#0A0A0A" />
          <text x="122" y="17" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">HTTPS://SURYACHALAM.VERCEL.APP</text>
        </a>
      </g>

      <text x="0" y="66" font-size="13.5" font-weight="600" fill="#3A3A3A">
        Production-grade WebGL developer portfolio, two-way recruiter CRM, and proactive deadline automation daemon.
      </text>
    </g>

    <!-- 3 Core Feature Architecture Cards -->
    <g transform="translate(32, 156)">
      
      <!-- Card 1: Two-Way Recruiter CRM -->
      <g transform="translate(0, 0)">
        <rect x="4" y="4" width="250" height="92" fill="#0A0A0A" />
        <rect x="0" y="0" width="250" height="92" fill="#FFF5F5" stroke="#0A0A0A" stroke-width="2.5" />
        <rect x="12" y="12" width="70" height="18" fill="#E3000F" stroke="#0A0A0A" stroke-width="1.5" />
        <text x="47" y="24" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">SMTP CRM</text>
        <text x="12" y="46" font-size="12" font-weight="900" fill="#0A0A0A">Two-Way Threading</text>
        <text x="12" y="64" font-size="10" font-weight="600" fill="#555555">Resend Inbound Webhook</text>
        <text x="12" y="78" font-size="9.5" font-weight="700" fill="#E3000F">In-Reply-To Header Resolution</text>
      </g>

      <!-- Card 2: Proactive Deadline Intelligence -->
      <g transform="translate(275, 0)">
        <rect x="4" y="4" width="250" height="92" fill="#0A0A0A" />
        <rect x="0" y="0" width="250" height="92" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2.5" />
        <rect x="12" y="12" width="85" height="18" fill="#0A0A0A" stroke="#0A0A0A" stroke-width="1.5" />
        <text x="54" y="24" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">BACKGROUND CRON</text>
        <text x="12" y="46" font-size="12" font-weight="900" fill="#0A0A0A">Deadline Daemon</text>
        <text x="12" y="64" font-size="10" font-weight="600" fill="#555555">43 Active Warning Windows</text>
        <text x="12" y="78" font-size="9.5" font-weight="700" fill="#0A0A0A">Automated Digest &amp; Expiry Logic</text>
      </g>

      <!-- Card 3: Privacy-Preserving Telemetry -->
      <g transform="translate(550, 0)">
        <rect x="4" y="4" width="250" height="92" fill="#0A0A0A" />
        <rect x="0" y="0" width="250" height="92" fill="#FFF5F5" stroke="#0A0A0A" stroke-width="2.5" />
        <rect x="12" y="12" width="90" height="18" fill="#E3000F" stroke="#0A0A0A" stroke-width="1.5" />
        <text x="57" y="24" font-size="8.5" font-weight="900" fill="#FFFFFF" text-anchor="middle">ZERO-COOKIE STATS</text>
        <text x="12" y="46" font-size="12" font-weight="900" fill="#0A0A0A">SHA-256 Telemetry</text>
        <text x="12" y="64" font-size="10" font-weight="600" fill="#555555">Anonymized Remote Hash</text>
        <text x="12" y="78" font-size="9.5" font-weight="700" fill="#E3000F">Visits, Downloads, Project Views</text>
      </g>
    </g>

  </g>
</svg>
